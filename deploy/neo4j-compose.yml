services:
  neo4j:
    image: neo4j:5.26-community
    container_name: ira-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in the deployment environment}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - ira_neo4j_data:/data
      - ira_neo4j_logs:/logs

volumes:
  ira_neo4j_data:
  ira_neo4j_logs:
