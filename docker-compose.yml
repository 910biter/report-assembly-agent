services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: ira-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ira-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    # 离线部署:模型预先导入 ollama_models 卷(ollama pull / ollama create)
    # GPU 加速:加 deploy.resources.reservations.devices 或 --gpus all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ira-app
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      IRA_HOST: 0.0.0.0
      IRA_PORT: "8000"
      IRA_RUNTIME_ROOT: /app/runtime
      IRA_OLLAMA_URL: http://ollama:11434
      IRA_GENERATION_MODEL: qwen-agent:latest
      IRA_EMBEDDING_MODEL: qwen-embed:latest
      IRA_QDRANT_URL: http://qdrant:6333
      IRA_VECTOR_BACKEND: qdrant
    volumes:
      - ./runtime:/app/runtime
      - ./materials:/app/materials
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"

volumes:
  qdrant_data:
  ollama_models:
  hf_cache:
